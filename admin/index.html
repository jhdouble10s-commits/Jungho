<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원 관리 · Sitescout</title>
  <link rel="stylesheet" href="../login/auth.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="card admin-card">
    <div class="mark">S</div><p class="eyebrow">SITESCOUT</p>
    <h1>회원 관리</h1><p class="description">승인 대기 회원을 확인하고 가입을 승인하거나 거절하세요.</p>
    <p class="message" role="status">접근 권한 확인 중…</p>
    <section id="memberManagement" hidden aria-label="회원 관리">
      <form id="createAccountForm">
        <h2>계정 직접 발급</h2>
        <p class="description">발급한 계정은 이메일 확인 없이 바로 로그인할 수 있습니다.</p>
        <label for="newUsername">아이디</label><input id="newUsername" name="username" required pattern="[a-z0-9][a-z0-9_.\-]{2,31}" minlength="3" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="usernameHelp">
        <p id="usernameHelp" class="description">영문 소문자, 숫자, 점(.), 밑줄(_), 하이픈(-)으로 3~32자</p>
        <label for="newDisplayName">이름 또는 닉네임</label><input id="newDisplayName" name="displayName" required maxlength="80" autocomplete="off">
        <label for="newPassword">초기 비밀번호</label><input id="newPassword" name="password" type="password" required minlength="6" autocomplete="new-password">
        <button class="submit" type="submit">계정 발급</button>
        <p id="createAccountMessage" class="message" role="status"></p>
      </form>
      <h2>승인 대기 회원</h2>
      <button id="refreshMembers" class="submit" type="button">목록 새로고침</button>
      <div class="member-table"><table><thead><tr><th scope="col">이메일</th><th scope="col">이름/닉네임</th><th scope="col">가입일</th><th scope="col">처리</th></tr></thead><tbody id="pendingMembers"></tbody></table></div>
      <p id="emptyMembers" hidden>승인 대기 회원이 없습니다.</p>
    </section>
    <a class="back" href="../">편집기로 돌아가기</a>
    <a class="back" href="../login/">로그인</a>
  </main>
  <script type="module" src="admin.js"></script>
</body>
</html>
