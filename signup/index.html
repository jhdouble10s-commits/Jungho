<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>회원가입 · Sitescout</title>
  <link rel="stylesheet" href="../login/auth.css">
</head>
<body>
  <main class="card">
    <div class="mark">S</div><p class="eyebrow">SITESCOUT</p>
    <h1>회원가입</h1><p class="description">이메일 확인과 관리자 승인 후 Sitescout을 이용할 수 있습니다.</p>
    <form id="signupForm">
      <label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="email" required autofocus>
      <label for="displayName">이름 또는 닉네임</label><input id="displayName" name="displayName" autocomplete="nickname" required maxlength="80">
      <label for="password">비밀번호</label><div class="password"><input id="password" name="password" type="password" autocomplete="new-password" required minlength="6"><button class="toggle" type="button" aria-label="비밀번호 표시">보기</button></div>
      <label for="passwordConfirm">비밀번호 확인</label><input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="6">
      <button class="submit" type="submit">회원가입</button><p class="message" aria-live="polite"></p>
    </form>
    <a class="back" href="../login/">이미 계정이 있나요? 로그인</a>
  </main>
  <script type="module" src="../dist/auth-form.js"></script>
</body>
</html>
