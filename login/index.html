<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · Sitescout</title>
  <style>
    :root{color-scheme:dark;--accent:#ff5100;--bg:#070708;--surface:#121215;--line:#343438;--text:#f6f5f2;--sub:#aaa9b0}*{box-sizing:border-box}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 70% 60% at 10% 0,#482111 0,transparent 65%),radial-gradient(ellipse 60% 50% at 95% 100%,#21172c 0,transparent 70%),var(--bg);font:16px "Noto Sans KR",system-ui,sans-serif;color:var(--text)}.card{width:min(100%,420px);padding:36px;border:1px solid color-mix(in srgb,var(--accent) 34%,var(--line));border-radius:20px;background:linear-gradient(145deg,#17171a,#0e0e10);box-shadow:0 26px 70px #0009}.mark{display:grid;place-items:center;width:42px;height:42px;margin-bottom:26px;border-radius:13px;background:linear-gradient(135deg,#ff7540,var(--accent));font-weight:900;color:white}.eyebrow{margin:0 0 8px;color:#ff9a70;font-size:13px;font-weight:800;letter-spacing:.05em}.card h1{margin:0;font-size:28px;letter-spacing:-.05em}.description{margin:10px 0 26px;color:var(--sub);line-height:1.65;font-size:14px}label{display:block;margin:15px 0 6px;font-size:13px;font-weight:700}input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#09090b;color:var(--text);font:inherit;outline:0}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ff51002e}.password{position:relative}.password input{padding-right:48px}.toggle{position:absolute;right:7px;top:7px;height:30px;border:0;border-radius:7px;background:transparent;color:var(--sub);cursor:pointer}.submit{width:100%;height:46px;margin-top:24px;border:0;border-radius:10px;background:linear-gradient(135deg,#ff7540,var(--accent));color:white;font:800 15px inherit;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.message{min-height:20px;margin:14px 0 0;color:var(--sub);font-size:13px}.message.error{color:#ff9c75}.back{display:block;margin-top:24px;color:var(--sub);font-size:13px;text-align:center;text-decoration:none}.back:hover{color:var(--text)}@media(max-width:480px){.card{padding:28px 22px;border-radius:16px}}
  </style>
</head>
<body>
  <main class="card"><div class="mark">S</div><p class="eyebrow">SITESCOUT</p><h1>다시 오신 것을 환영합니다</h1><p class="description">계정에 로그인하여 작업을 계속하세요.</p><form id="loginForm"><label for="username">이메일 또는 아이디</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">비밀번호</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"><button class="toggle" type="button" aria-label="비밀번호 표시">보기</button></div><button class="submit" type="submit">로그인</button><p class="message" aria-live="polite"></p></form><a class="back" href="../">편집기로 돌아가기</a></main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0/+esm';
    const client=createClient('https://htzojicodwueivybovhy.supabase.co','sb_publishable_tgU1Ue4yOSJxG2Z6CTunPw_gvKhXtpq');
    const form=document.querySelector('#loginForm'),message=document.querySelector('.message'),submit=form.querySelector('.submit'),password=document.querySelector('#password'),toggle=document.querySelector('.toggle');
    toggle.onclick=()=>{const shown=password.type==='text';password.type=shown?'password':'text';toggle.textContent=shown?'보기':'숨기기';toggle.setAttribute('aria-label',shown?'비밀번호 표시':'비밀번호 숨기기')};
    form.addEventListener('submit',async(event)=>{event.preventDefault();const data=new FormData(form),raw=String(data.get('username')).trim().toLowerCase(),email=raw.includes('@')?raw:`${raw}@users.sitescout.local`;message.className='message';message.textContent='로그인 중…';submit.disabled=true;const {error}=await client.auth.signInWithPassword({email,password:String(data.get('password'))});submit.disabled=false;if(error){message.className='message error';message.textContent=error.message||'로그인에 실패했습니다.';return}location.replace('../')});
  </script>
</body>
</html>
