<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로그인 · Sitescout</title>

<body>
  <main class="card"><div class="mark">S</div><p class="eyebrow">SITESCOUT</p><h1>다시 오신 것을 환영합니다</h1><p class="description">계정에 로그인하여 작업을 계속하세요.</p><form id="loginForm"><label for="username">이메일 또는 아이디</label><input id="username" name="username" autocomplete="username" required autofocus><label for="password">비밀번호</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="6"><button class="toggle" type="button" aria-label="비밀번호 표시">보기</button></div><button class="submit" type="submit">로그인</button><p class="message" aria-live="polite"></p></form><a class="back" href="../signup/">계정이 없나요? 회원가입</a></main>
  <script type="module" src="../dist/auth-form.js"></script>
