<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EPUB 만들기</title>
    <style>
        :root {
            --ink: #182136;
            --muted: #64718a;
            --line: #dce2ee;
            --bg: #f5f7fb;
            --nav: #182136;
            --accent: #6558d5;
            --soft: #efedff
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font: 16px "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
            color: var(--ink);
            background: var(--bg)
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 232px 1fr
        }

        .side {
            background: var(--nav);
            color: #fff;
            padding: 28px 16px;
            display: flex;
            flex-direction: column
        }

        .brand {
            font-weight: 800;
            font-size: 18px;
            padding: 0 12px 30px
        }

        .brand small {
            display: block;
            color: #afbbd0;
            font-size: 12px;
            font-weight: 400;
            margin-top: 6px
        }

        .tabs {
            display: grid;
            gap: 6px
        }

        .tab {
            width: 100%;
            border: 0;
            padding: 12px;
            border-radius: 10px;
            background: transparent;
            color: #cbd4e4;
            text-align: left;
            font: 700 14px inherit;
            cursor: pointer
        }

        .tab:hover,
        .tab.active {
            background: #312d59;
            color: #fff
        }

        .tip {
            margin-top: auto;
            border-top: 1px solid #344056;
            padding: 18px 12px 0;
            color: #afbbd0;
            font-size: 12px;
            line-height: 1.7
        }

        main {
            max-width: 1450px;
            margin: auto;
            padding: 30px 36px 50px;
            width: 100%
        }

        .top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px
        }

        .top h1 {
            font-size: 28px;
            letter-spacing: -.06em;
            margin: 0
        }

        .top p {
            color: var(--muted);
            font-size: 14px;
            margin: 8px 0
        }

        .primary {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 9px;
            padding: 12px 17px;
            font-weight: 800;
            cursor: pointer
        }

        .grid {
            display: grid;
            grid-template-columns: 270px minmax(340px, 1fr) minmax(300px, .85fr);
            gap: 18px
        }

        .card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 3px 12px #1b29400a
        }

        .head {
            font-weight: 800;
            font-size: 14px;
            padding: 16px 17px;
            border-bottom: 1px solid var(--line)
        }

        .chapters {
            padding: 8px
        }

        .chapter {
            width: 100%;
            border: 0;
            background: transparent;
            border-radius: 8px;
            padding: 10px;
            text-align: left;
            cursor: pointer;
            color: var(--ink)
        }

        .chapter:hover {
            background: #f5f6fa
        }

        .chapter.active {
            background: var(--soft);
            color: #4135a4;
            font-weight: 800
        }

        .num {
            color: #8d99ae;
            font-size: 12px;
            margin-right: 8px
        }

        .add {
            width: calc(100% - 16px);
            margin: 7px 8px 13px;
            border: 1px dashed #aaa3e6;
            border-radius: 8px;
            background: #faf9ff;
            padding: 9px;
            color: #4d40bf;
            font-weight: 700;
            cursor: pointer
        }

        .editor,
        .settings,
        .preview-card {
            padding: 20px
        }

        .fields {
            display: grid;
            grid-template-columns: 1fr 110px;
            gap: 12px
        }

        .full {
            grid-column: 1/-1
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: #46536a;
            margin-bottom: 6px
        }

        input,
        textarea {
            font: inherit;
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px;
            color: var(--ink);
            outline: none
        }

        input:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px #6558d51c
        }

        textarea {
            resize: vertical
        }

        .code {
            height: 580px;
            font: 13px/1.65 Consolas, "Courier New", monospace
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin: 12px 0
        }

        .secondary {
            font-weight: 700;
            font-size: 12px;
            color: #38455a;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            padding: 8px 10px;
            cursor: pointer
        }

        .danger {
            color: #b01f37;
            margin-left: auto
        }

        .preview {
            height: 680px;
            padding: 18px;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: auto
        }

        .preview img {
            max-width: 100%;
            height: auto
        }

        .preview table {
            border-collapse: collapse
        }

        .preview td,
        .preview th {
            border: 1px solid #aaa;
            padding: 5px
        }

        .settings {
            max-width: 720px
        }

        .settings section+section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--line)
        }

        h2 {
            font-size: 14px;
            margin: 0 0 12px
        }

        .field {
            margin-bottom: 11px
        }

        .css {
            height: 440px;
            font: 12px/1.55 Consolas, "Courier New", monospace
        }

        .cover {
            border: 1px dashed #b7bfd0;
            padding: 10px;
            border-radius: 9px
        }

        .cover img {
            display: block;
            max-height: 130px;
            max-width: 100%;
            margin: 10px auto 0
        }

        .hint,
        .images {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.55
        }

        .images {
            list-style: none;
            padding: 0
        }

        .images li {
            border-bottom: 1px solid #edf0f5;
            padding: 5px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .status {
            display: none;
            margin: 0 0 18px;
            padding: 12px 14px;
            border-radius: 9px;
            font-size: 13px
        }

        .status.ok {
            display: block;
            background: #eaf8ef;
            color: #176535
        }

        .status.error {
            display: block;
            background: #fff0f1;
            color: #a42135
        }

        .view {
            display: none
        }

        .view.active {
            display: block
        }

        @media(max-width:1050px) {
            .grid {
                grid-template-columns: 235px 1fr
            }

            .preview-card {
                grid-column: 1/-1
            }

            .preview {
                height: 450px
            }
        }

        @media(max-width:700px) {
            .app {
                grid-template-columns: 1fr
            }

            .side {
                padding: 14px 16px
            }

            .brand {
                padding: 0
            }

            .tip {
                display: none
            }

            .tabs {
                margin-top: 10px
            }

            .top {
                display: block
            }

            .primary {
                margin-top: 12px;
                width: 100%
            }

            main {
                padding: 22px 15px
            }

            .grid,
            .fields {
                display: block
            }

            .editor,
            .preview-card {
                margin-top: 18px
            }

            .full {
                margin-top: 12px
            }

            .code {
                height: 460px
            }

            .preview {
                height: 420px
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside class="side">
            <div class="brand">나의 작업실<small>개인용 전자책 도구</small></div>
            <nav class="tabs"><button class="tab active" data-view="editorView">✦ &nbsp;EPUB 만들기</button><button
                    class="tab" data-view="bookView">▣ &nbsp;책 정보</button><button class="tab" data-view="styleView">✎
                    &nbsp;공통 CSS</button></nav>
            <p class="tip">인터넷이나 서버 없이 작동합니다.<br>원고와 이미지는 이 브라우저 안에서만 처리됩니다.</p>
        </aside>
        <main>
            <div class="top">
                <div>
                    <h1 id="pageTitle">EPUB 만들기</h1>
                    <p id="pageDescription">본문, 이미지와 목차를 정리한 뒤 EPUB 3.0 파일로 내보냅니다.</p>
                </div><button id="export" class="primary">EPUB 3.0 내보내기</button>
            </div>
            <div id="status" class="status"></div>
            <div id="editorView" class="view active">
                <div class="grid">
                    <aside class="card">
                        <div class="head">책의 구성</div>
                        <div id="list" class="chapters"></div><button id="add" class="add">＋ 장 추가</button>
                    </aside>
                    <article class="card editor">
                        <div class="fields">
                            <div><label for="ctitle">장 제목 / 목차 표시명</label><input id="ctitle"></div>
                            <div><label for="clevel">목차 단계</label><input id="clevel" type="number" min="1" max="3">
                            </div>
                            <div class="full"><label for="body">본문 HTML — &lt;body&gt; 안에 넣을 내용만 작성하세요</label><textarea
                                    id="body" class="code" spellcheck="false"></textarea></div>
                        </div>
                        <div class="toolbar"><label class="secondary" for="image">이미지 업로드·삽입</label><input id="image"
                                type="file" accept="image/jpeg,image/png,image/gif,image/svg+xml" multiple
                                hidden><button id="previewBtn" class="secondary">미리보기 갱신</button><button id="del"
                                class="secondary danger">이 장 삭제</button></div>
                    </article>
                    <aside class="card preview-card">
                        <div class="head">미리보기</div>
                        <div id="preview" class="preview"></div>
                    </aside>
                </div>
            </div>
            <div id="bookView" class="view">
                <aside class="card settings">
                    <div class="head">책 정보</div>
                    <section>
                        <div class="field"><label for="title">책 제목</label><input id="title" value="새 전자책"></div>
                        <div class="field"><label for="author">저자</label><input id="author" placeholder="이름"></div>
                        <div class="field"><label for="language">언어</label><input id="language" value="ko"></div>
                        <div class="field"><label for="coverInput">표지 이미지</label>
                            <div class="cover"><input id="coverInput" type="file" accept="image/jpeg,image/png"><img
                                    id="coverPreview" hidden></div>
                            <p class="hint">JPG 또는 PNG, 세로형 이미지를 권장합니다.</p>
                        </div>
                    </section>
                </aside>
            </div>
            <div id="styleView" class="view">
                <aside class="card settings">
                    <div class="head">공통 CSS</div>
                    <section><textarea id="css"
                            class="css">body { font-family: serif; line-height: 1.8; } p { margin: 0 0 1em; } img { max-width: 100%; height: auto; } h1, h2, h3 { line-height: 1.4; }</textarea>
                        <p class="hint">모든 장에 자동으로 적용됩니다.</p>
                        <ul id="images" class="images"></ul>
                    </section>
                </aside>
            </div>
        </main>
    </div>
    <!-- Monaco와 Emmet은 HTML 편집 모드에서만 로드합니다. 기존 정적 앱 구조를 유지합니다. -->
